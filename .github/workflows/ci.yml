name: CI

on:
  push:
    branches: [main, 'fix/custom-provider-dns-pinning']
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, 'fix/ssrf-dns-fail-closed']

jobs:
  test:
    name: Test & build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The supported engines range (package.json: >=20.18 <25). 20 is the
        # CI baseline that has historically caught crashes newer local Node
        # versions hid; 22 is the LTS most contributors run; 24 is what the
        # Docker image ships since the Node 20 line reached end of life.
        node-version: ['20', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Generate an ephemeral, test-only HTTPS certificate. It is trusted only
      # by Node processes in this CI job, so tests can distinguish hostname
      # validation from an untrusted-certificate failure without storing keys.
      - name: Prepare ephemeral TLS test certificate
        shell: bash
        run: |
          set -euo pipefail
          TLS_DIR="$RUNNER_TEMP/pinned-provider-tls"
          mkdir -p "$TLS_DIR"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$TLS_DIR/key.pem" -out "$TLS_DIR/cert.pem" -days 2 -subj "/CN=provider.test" -addext "subjectAltName=DNS:provider.test" -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,digitalSignature,keyEncipherment,keyCertSign" -addext "extendedKeyUsage=serverAuth"
          echo "PINNED_PROVIDER_TEST_CERT=$TLS_DIR/cert.pem" >> "$GITHUB_ENV"
          echo "PINNED_PROVIDER_TEST_KEY=$TLS_DIR/key.pem" >> "$GITHUB_ENV"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$TLS_DIR/untrusted-key.pem" -out "$TLS_DIR/untrusted-cert.pem" -days 2 -subj "/CN=provider.test" -addext "subjectAltName=DNS:provider.test" -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,digitalSignature,keyEncipherment,keyCertSign" -addext "extendedKeyUsage=serverAuth"
          echo "PINNED_PROVIDER_UNTRUSTED_TEST_CERT=$TLS_DIR/untrusted-cert.pem" >> "$GITHUB_ENV"
          echo "PINNED_PROVIDER_UNTRUSTED_TEST_KEY=$TLS_DIR/untrusted-key.pem" >> "$GITHUB_ENV"
          echo "NODE_EXTRA_CA_CERTS=$TLS_DIR/cert.pem" >> "$GITHUB_ENV"

      - name: Check migration round trip
        run: npm run test:migrations

      # COVERAGE makes the server suite collect coverage inside this run rather
      # than running the whole suite a second time. Only the Node 22 leg sets it,
      # so the Node 20 leg keeps uninstrumented timings. Coverage is reporting
      # only; there are no thresholds and it never fails the build.
      - name: Run tests
        env:
          COVERAGE: ${{ matrix.node-version == '22' && '1' || '' }}
        run: npm test

      # server + cli only; the client has its own backlog of ESLint violations
      # and is brought in under a separate change.
      - name: Lint
        run: npm run lint

      - name: Build workspaces
        run: npm run build
